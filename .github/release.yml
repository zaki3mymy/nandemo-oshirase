# GitHub のリリースノートの自動生成（gh release create --generate-notes など）の設定
# PR のラベルで見出しに振り分ける。ラベルは zaki3mymy/github の Terraform で管理している
# 1つの PR は、上から見て最初に当てはまった見出しにだけ載る
changelog:
  exclude:
    labels:
      # develop から main へのリリース PR など。中身の個々の PR が載るので、リリース PR 自体は載せない
      - skip-release-notes
  categories:
    - title: 💥 破壊的変更
      labels:
        - breaking
    - title: 🚀 新機能
      labels:
        - feat
    - title: 🐛 バグ修正
      labels:
        - fix
    - title: 📦 依存関係の更新
      labels:
        - dependencies
    - title: 🔧 その他
      labels:
        - "*"
