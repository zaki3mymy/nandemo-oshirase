name: CD

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tf/**"
      - "openapi.yaml"
      - "pyproject.toml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

env:
  AWS_REGION: "ap-northeast-1"

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    name: Deploy to AWS
    environment: ${{ github.ref_name == 'main' && 'prod' || 'develop' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set environment config
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "tf_dir=tf/envs/prod" >> $GITHUB_OUTPUT
            echo "state_key=nandemo-oshirase/terraform.tfstate" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "tf_dir=tf/envs/dev" >> $GITHUB_OUTPUT
            echo "state_key=nandemo-oshirase/dev/terraform.tfstate" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Build docs
        run: npx --yes @redocly/cli build-docs openapi.yaml --output src/nandemo_oshirase/docs.html

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.9.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd ${{ steps.config.outputs.tf_dir }}
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ steps.config.outputs.state_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        run: |
          cd ${{ steps.config.outputs.tf_dir }}
          terraform apply \
            -var="line_channel_token=${{ secrets.LINE_CHANNEL_TOKEN }}" \
            -var="line_user_id=${{ secrets.LINE_USER_ID }}" \
            -auto-approve

      - name: Test POST /notify
        if: steps.config.outputs.env == 'dev'
        run: |
          API_ENDPOINT=$(cd ${{ steps.config.outputs.tf_dir }} && terraform output -raw api_endpoint)
          API_KEY=$(cd ${{ steps.config.outputs.tf_dir }} && terraform output -raw api_key)

          RESPONSE=$(curl -s -X POST "$API_ENDPOINT" \
            -H "x-api-key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"message": "GitHub Actions deployment completed!"}')

          echo "Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q "Successfully sent"; then
            echo "POST /notify test passed!"
          else
            echo "POST /notify test failed!"
            exit 1
          fi

      # 空メッセージは Lambda の検証で除かれるため LINE への push は発生せず、
      # API キー・API Gateway・Lambda までの疎通だけを確認できる
      - name: Test POST /notify (without sending to LINE)
        if: steps.config.outputs.env == 'prod'
        run: |
          API_ENDPOINT=$(cd ${{ steps.config.outputs.tf_dir }} && terraform output -raw api_endpoint)
          API_KEY=$(cd ${{ steps.config.outputs.tf_dir }} && terraform output -raw api_key)

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST "$API_ENDPOINT" \
            -H "x-api-key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"messages": [""]}')

          echo "Status: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" = "400" ] && grep -q "No valid messages to send" response.json; then
            echo "POST /notify test passed!"
          else
            echo "POST /notify test failed!"
            exit 1
          fi

      - name: Smoke test oshirase CLI
        env:
          ENV: ${{ steps.config.outputs.env }}
        run: |
          NAME="ci-${{ github.run_id }}"
          uv run oshirase --env $ENV add "$NAME" --weekly sun --at 03:00 -m "CI smoke test"
          uv run oshirase --env $ENV list | grep -q "^$NAME "
          uv run oshirase --env $ENV show "$NAME"
          uv run oshirase --env $ENV update "$NAME" --at 04:00
          uv run oshirase --env $ENV disable "$NAME"
          uv run oshirase --env $ENV delete "$NAME"
          if uv run oshirase --env $ENV list | grep -q "^$NAME "; then
            echo "CLI smoke test failed! $NAME still exists after delete"
            exit 1
          fi

      - name: Smoke test scheduler fires Lambda
        if: steps.config.outputs.env == 'dev'
        run: |
          NAME="ci-fire-${{ github.run_id }}"
          START_MS=$(( $(date +%s) * 1000 ))
          read MIN HOUR DAY MONTH YEAR <<< "$(TZ=Asia/Tokyo date -d '+2 min' '+%M %H %d %m %Y')"
          uv run oshirase --env dev add "$NAME" \
            --cron "$((10#$MIN)) $((10#$HOUR)) $((10#$DAY)) $((10#$MONTH)) ? $YEAR" \
            -m "CI smoke test: scheduler fired (${{ github.sha }})"

          LOG_GROUP="/aws/lambda/dev-nandemo-oshirase-function"
          REQUEST_ID=""
          DEADLINE=$(( $(date +%s) + 240 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if [ -z "$REQUEST_ID" ]; then
              # Lambda のテキストログは "[INFO]<TAB>時刻<TAB>リクエストID<TAB>本文" の形式
              REQUEST_ID=$(aws logs filter-log-events \
                --log-group-name "$LOG_GROUP" \
                --start-time "$START_MS" \
                --filter-pattern '"Scheduled invocation" "schedule/dev-nandemo-oshirase-reminders/'"$NAME"'"' \
                --query 'events[0].message' --output text \
                | awk -F'\t' 'NF>=4 && $1 != "None" {print $3; exit}')
              [ -n "$REQUEST_ID" ] && echo "Scheduler invoked Lambda (request id: $REQUEST_ID)"
            fi
            if [ -n "$REQUEST_ID" ]; then
              COUNT=$(aws logs filter-log-events \
                --log-group-name "$LOG_GROUP" \
                --start-time "$START_MS" \
                --filter-pattern '"'"$REQUEST_ID"'" "All messages sent successfully"' \
                --query 'length(events)' --output text)
              if [ "$COUNT" != "0" ]; then
                echo "Scheduler fire test passed!"
                PASSED=1
                break
              fi
            fi
            sleep 15
          done

          if [ -z "${PASSED:-}" ]; then
            echo "Scheduler fire test failed! (request id: ${REQUEST_ID:-not found})"
            exit 1
          fi

          uv run oshirase --env dev delete "$NAME"
          if uv run oshirase --env dev list | grep -q "^$NAME "; then
            echo "Scheduler fire test failed! $NAME still exists after delete"
            exit 1
          fi

      # 正常系の delete は各テストのステップで検証済み。
      # ここはテスト途中で失敗したときの後片付け用なので失敗を無視する
      - name: Cleanup oshirase CLI smoke test
        if: always()
        env:
          ENV: ${{ steps.config.outputs.env }}
        run: uv run oshirase --env $ENV delete "ci-${{ github.run_id }}" || true

      - name: Cleanup scheduler fire test
        if: always() && steps.config.outputs.env == 'dev'
        run: uv run oshirase --env dev delete "ci-fire-${{ github.run_id }}" || true

      - name: Test GET /docs
        run: |
          API_ENDPOINT=$(cd ${{ steps.config.outputs.tf_dir }} && terraform output -raw api_endpoint)
          DOCS_URL="${API_ENDPOINT%/notify}/docs"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DOCS_URL")
          echo "GET /docs status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "GET /docs test passed!"
          else
            echo "GET /docs test failed! Expected 200, got $HTTP_STATUS"
            exit 1
          fi
