name: Mutation test

# 週に一度、単体テストにミューテーションテストをかけ、結果を issue にまとめる。
# 対応が必要なもの（高・中）があれば、開いている issue の本文を上書きする（無ければ作る）。
# 0 件になったら、その issue にコメントしてクローズする
on:
  schedule:
    # 毎週月曜 7:53（日本時間）。毎時 0 分は実行が混み合って遅れやすいので避ける
    - cron: "53 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-test
  cancel-in-progress: false

jobs:
  mutmut:
    runs-on: ubuntu-latest
    name: Mutation test
    permissions:
      contents: read
      issues: write # 結果の issue を作る・更新する・クローズするため

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # CI の Test with coverage のジョブが保存した npm のキャッシュ（@redocly/cli）を使う（読むだけ）
      - name: Restore npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('scripts/build-docs.sh') }}

      # GET /docs のテストが docs.html を読むので、単体テストと同じく生成しておく
      - name: Build docs
        run: scripts/build-docs.sh dev

      - name: Run mutmut
        run: uv run mutmut run

      - name: Build report
        id: report
        run: >-
          uv run python scripts/mutation_report.py
          --out "$RUNNER_TEMP/mutation-report.md"
          --full mutation-report-full.md
          --summary "$RUNNER_TEMP/mutation-summary.md"

      - name: Upload report
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutation-report-full.md
          retention-days: 90

      - name: Update issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_FILE: ${{ runner.temp }}/mutation-report.md
          SUMMARY_FILE: ${{ runner.temp }}/mutation-summary.md
          ACTIONABLE: ${{ steps.report.outputs.actionable }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs')
            // このワークフローの issue だと分かる目印（画面には表示されない）
            const marker = '<!-- mutation-test-report -->'
            const actionable = Number(process.env.ACTIONABLE)

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100,
            })
            const current = issues.find((i) => !i.pull_request && i.body?.startsWith(marker))
            const previous = current?.body?.match(/<!-- mutation-score:([\d.]+) -->/)?.[1]
            const withPrevious = (text) =>
              text.replace('{{PREVIOUS_SCORE}}', previous ? `${previous}%` : 'なし')

            if (actionable === 0) {
              if (current) {
                // クローズするときは本文を書き換えないので、最後の結果はコメントに残す
                const summary = withPrevious(fs.readFileSync(process.env.SUMMARY_FILE, 'utf8'))
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: current.number,
                  body: [
                    '対応が必要なミュータント（高・中）がなくなったので、クローズします。',
                    '',
                    summary,
                    `全件のレポート: ${process.env.ARTIFACT_URL} / 実行: ${process.env.RUN_URL}`,
                  ].join('\n'),
                })
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: current.number,
                  state: 'closed',
                  state_reason: 'completed',
                })
                core.info(`closed #${current.number}`)
              } else {
                core.info('nothing to report')
              }
              return
            }

            let body = withPrevious(fs.readFileSync(process.env.REPORT_FILE, 'utf8'))
            body = [
              marker,
              body,
              '',
              `全件のレポート: ${process.env.ARTIFACT_URL} / 実行: ${process.env.RUN_URL}`,
            ].join('\n')

            if (current) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: current.number,
                body,
              })
              core.info(`updated #${current.number}`)
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'ミューテーションテストで見つかったテストの改善点',
                body,
              })
              core.info(`created #${created.number}`)
            }
