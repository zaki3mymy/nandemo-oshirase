name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "tf/**"
      - "openapi.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - ".python-version"
      - ".github/workflows/ci.yml"
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Pre-commit checks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Build docs
        run: npx --yes @redocly/cli build-docs openapi.yaml --output src/nandemo_oshirase/docs.html

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17.0"

      - name: Terraform init (for validate)
        run: |
          terraform -chdir=tf/envs/prod init -backend=false
          terraform -chdir=tf/envs/dev init -backend=false

      # pre-commit/action は内部で Node.js 20 向けの actions/cache を使うため、直接実行する
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

  test-unit:
    runs-on: ubuntu-latest
    name: Test with coverage

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Build docs
        run: npx --yes @redocly/cli build-docs openapi.yaml --output src/nandemo_oshirase/docs.html

      - name: Run tests
        run: uv run pytest --cov-report=html --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  test-integration:
    runs-on: ubuntu-latest
    name: Integration tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Create local env file
        run: cp .env.example .env.local

      - name: Start local stack
        run: docker compose -f podman-compose.yml up -d --build stub otel-collector jaeger prometheus lambda

      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:13133/ > /dev/null \
              && curl -sf http://localhost:9090/-/healthy > /dev/null \
              && curl -sf http://localhost:16686/api/services > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "services did not become ready in time" >&2
          exit 1

      - name: Run integration tests
        run: uv run pytest tests/integration/

      - name: Dump container logs
        if: failure()
        run: docker compose -f podman-compose.yml logs

      - name: Stop local stack
        if: always()
        run: docker compose -f podman-compose.yml down -v

  terraform-plan:
    runs-on: ubuntu-latest
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    needs: [pre-commit, test-integration]
    environment: ${{ github.base_ref == 'main' && 'prod' || 'develop' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write # plan の結果を PR にコメントするため

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set environment config
        id: config
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "tf_dir=tf/envs/prod" >> $GITHUB_OUTPUT
            echo "state_key=nandemo-oshirase/terraform.tfstate" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "tf_dir=tf/envs/dev" >> $GITHUB_OUTPUT
            echo "state_key=nandemo-oshirase/dev/terraform.tfstate" >> $GITHUB_OUTPUT
          fi

      # Lambda の zip（src/nandemo_oshirase）には docs.html が含まれる。CD と同じく生成しないと
      # zip の内容が変わり、plan に Lambda の source_code_hash の差分が毎回出てしまう
      - name: Build docs
        run: npx --yes @redocly/cli build-docs openapi.yaml --output src/nandemo_oshirase/docs.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17.0"

      - name: Terraform Init
        run: |
          cd ${{ steps.config.outputs.tf_dir }}
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ steps.config.outputs.state_key }}" \
            -backend-config="region=ap-northeast-1"

      - name: Terraform Plan
        id: plan
        # tee でログにも出しつつファイルに保存する。
        # shell を明示すると pipefail が有効になり、plan の失敗を tee で握りつぶさない
        shell: bash
        run: |
          cd ${{ steps.config.outputs.tf_dir }}
          terraform plan -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Comment plan result
        # plan が失敗した場合も、エラーの内容を PR に残す
        if: always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          TF_ENV: ${{ steps.config.outputs.env }}
        with:
          script: |
            const fs = require('fs')
            let plan = fs.existsSync(process.env.PLAN_FILE)
              ? fs.readFileSync(process.env.PLAN_FILE, 'utf8')
              : '(plan の出力がありません)'

            // 公開リポジトリのコメントにアカウントIDやリソースのIDが並ばないよう、
            // 既存リソースの読み込みの行（Refreshing state... [id=...] など）を除き、
            // 変更内容・エラー・警告だけを残す
            const noise = /^\S.*: (Refreshing state\.\.\.|Reading\.\.\.|Read complete after|Preparing import\.\.\.)/
            plan = plan.split('\n').filter((line) => !noise.test(line)).join('\n').trim()

            // PR のコメントは 65,536 文字までなので、長すぎる場合は末尾を残して切り詰める
            const limit = 60000
            if (plan.length > limit) {
              plan = '... (先頭を省略。全文は Actions のログを参照) ...\n' + plan.slice(-limit)
            }

            let body = `## Terraform Plan (${process.env.TF_ENV})\n\n`
            if (process.env.PLAN_OUTCOME !== 'success') {
              body += ':x: **plan に失敗しました。**\n\n'
            }
            if (process.env.PLAN_OUTCOME === 'success' && plan.includes('No changes.')) {
              body += 'No changes.'
            } else {
              body += [
                '<details>',
                '<summary>Show plan</summary>',
                '',
                '```',
                plan,
                '```',
                '',
                '</details>',
              ].join('\n')
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            })
