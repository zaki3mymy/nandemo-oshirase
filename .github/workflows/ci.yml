name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "tf/**"
      - "openapi.yaml"
      - "scripts/**"
      - "Containerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - ".python-version"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"
  workflow_call:

env:
  # キャッシュ（nix のストア・uv・pre-commit・Terraform のプロバイダー）は develop・main への push で CD から呼ばれたときだけ保存する。
  # PR で作ったキャッシュはその PR でしか使えないので、PR では読むだけにする
  SAVE_CACHE: ${{ github.event_name != 'pull_request' }}

jobs:
  # pre-commit は flake.nix の devShell の中で実行する（ローカルと同じ pre-commit・uv を使う）
  pre-commit:
    runs-on: ubuntu-latest
    name: Pre-commit checks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # flakes は既定で有効。github: の入力の取得には github.token を使う
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # ツールが変わるのは flake.nix・flake.lock が変わったときだけなので、それをキーにする。
      # キーが違う古いキャッシュは復元しない。復元すると、使わなくなったストアのパスまで新しいキャッシュに入り、
      # キャッシュが大きくなり続ける（復元に時間がかかる）。キーが変わった直後の 1 回だけ、ツールをダウンロードし直す
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: ${{ env.SAVE_CACHE }}

      # uv のパッケージのキャッシュと、pre-commit のフックの環境（pre-commit-hooks など）。
      # 保存は最後のステップで、SAVE_CACHE のときだけ行う
      - name: Restore uv and pre-commit cache
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pre-commit
          key: tools-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml', 'flake.lock') }}
          restore-keys: tools-${{ runner.os }}-

      # devShell の用意（ツールの取得）を、ほかのステップと分けて時間を見られるようにする
      - name: Set up dev shell
        run: nix develop -c pre-commit --version

      - name: Install dependencies
        run: nix develop -c uv sync --dev

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17.0"

      # Terraform のプロバイダー（aws は大きく、1回 7 秒ほどかかる）を毎回ダウンロードしないよう、プラグインのキャッシュを使う。
      # プロバイダーが変わるのは .terraform.lock.hcl が変わったときだけなので、それをキーにする
      - name: Prepare Terraform provider cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Restore Terraform provider cache
        id: tf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('tf/envs/*/.terraform.lock.hcl') }}

      - name: Terraform init (for validate)
        run: |
          terraform -chdir=tf/envs/prod init -backend=false
          terraform -chdir=tf/envs/dev init -backend=false

      # pre-commit/action は内部で Node.js 20 向けの actions/cache を使うため、直接実行する。
      # terraform は flake に入れていないので、上の setup-terraform で入れたものを使う。
      # 単体テスト（pytest のフック）は Test with coverage のジョブで実行するので、ここでは飛ばす
      - name: Run pre-commit
        env:
          SKIP: pytest
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure --color=always

      # uv のキャッシュから、CI で取り直したほうが速いもの（ビルド済みの wheel 以外）を消してから保存する
      - name: Prune uv cache
        if: env.SAVE_CACHE == 'true' && steps.tool-cache.outputs.cache-hit != 'true'
        run: nix develop -c uv cache prune --ci

      - name: Save uv and pre-commit cache
        if: env.SAVE_CACHE == 'true' && steps.tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pre-commit
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}

      - name: Save Terraform provider cache
        if: env.SAVE_CACHE == 'true' && steps.tf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ steps.tf-cache.outputs.cache-primary-key }}

  test-unit:
    runs-on: ubuntu-latest
    name: Test with coverage

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # scripts/build-docs.sh の npx が取る @redocly/cli を、npm のキャッシュから使う。
      # バージョンは build-docs.sh で固定しているので、build-docs.sh をキーにする。保存はほかのキャッシュと同じく SAVE_CACHE のときだけ
      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('scripts/build-docs.sh') }}

      - name: Build docs
        run: scripts/build-docs.sh dev

      - name: Save npm cache
        if: env.SAVE_CACHE == 'true' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Run tests
        run: uv run pytest --cov-report=html --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  test-integration:
    runs-on: ubuntu-latest
    name: Integration tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Create local env file
        run: cp .env.example .env.local

      # Lambda 以外のサービスの起動（イメージの pull が大半）と、Lambda のイメージのビルドを同時に行い、
      # 両方が終わってから Lambda を起動する。
      # Lambda のイメージ（lambda・lambda-quota で共通）は 1 回だけビルドし、compose が付ける名前
      # （<プロジェクト名>-<サービス名>）で両方のタグを付ける（compose でビルドすると、サービスごとに書き出す）。
      # ビルドのキャッシュ（type=gha）は使わない。GitHub Actions のキャッシュから層（pip install の約 160MB）を
      # ダウンロードして展開するほうが、ベースイメージを取得して pip install し直すより遅かった（28 秒と 15 秒）
      - name: Start local stack
        run: |
          docker compose -f podman-compose.yml up -d --no-build stub dynamodb dynamodb-init otel-collector jaeger prometheus loki &
          services=$!
          docker build -f Containerfile -t nandemo-oshirase-lambda:latest -t nandemo-oshirase-lambda-quota:latest . &
          build=$!
          # どちらかが失敗したら、wait が失敗の終了コードを返し、ステップが失敗する
          wait "$services"
          wait "$build"
          # Lambda は dynamodb-init（テーブルを作って終わる）の完了を待つ設定なので、ここで完了を確かめる。
          # そのうえで --no-deps で起動する（依存先も指定すると、終わった dynamodb-init がもう一度動き、
          # テーブルがすでにあるので失敗する）
          init_exit=$(docker wait "$(docker compose -f podman-compose.yml ps -aq dynamodb-init)")
          if [ "$init_exit" != "0" ]; then
            echo "dynamodb-init failed with exit code $init_exit" >&2
            exit 1
          fi
          docker compose -f podman-compose.yml up -d --no-build --no-deps lambda lambda-quota

      # 1 秒おきに問い合わせ（最大 60 秒）、まだ応答しないサービスをログに出す（どれを待っているか分かるように）
      - name: Wait for services to be healthy
        run: |
          urls=(
            "http://localhost:13133/"               # otel-collector
            "http://localhost:9090/-/healthy"       # prometheus
            "http://localhost:16686/api/services"   # jaeger
            "http://localhost:3100/ready"           # loki
          )
          for i in $(seq 1 60); do
            not_ready=()
            for url in "${urls[@]}"; do
              curl -sf --max-time 2 "$url" > /dev/null || not_ready+=("$url")
            done
            if [ ${#not_ready[@]} -eq 0 ]; then
              echo "all services are ready (${SECONDS}s)"
              exit 0
            fi
            echo "${SECONDS}s: not ready: ${not_ready[*]}"
            sleep 1
          done
          echo "services did not become ready in time" >&2
          exit 1

      - name: Run integration tests
        run: uv run pytest tests/integration/

      # ローカルのスタックは止めない。ランナーはジョブが終わると捨てられるので、止める必要がない。
      # 止めると、Jaeger が終了のシグナルに応えず、タイムアウト（10 秒）で強制終了されるまで待つことになる
      - name: Dump container logs
        if: failure()
        run: docker compose -f podman-compose.yml logs

  terraform-plan:
    runs-on: ubuntu-latest
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    needs: [pre-commit, test-integration]
    environment: ${{ github.base_ref == 'main' && 'prod' || 'develop' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write # plan の結果を PR にコメントするため

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ドキュメントに入れるバージョンを git describe --tags で決めるため、すべての履歴とタグを取る
          fetch-depth: 0

      - name: Set environment config
        id: config
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "tf_dir=tf/envs/prod" >> $GITHUB_OUTPUT
            echo "state_key=nandemo-oshirase/terraform.tfstate" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "tf_dir=tf/envs/dev" >> $GITHUB_OUTPUT
            echo "state_key=nandemo-oshirase/dev/terraform.tfstate" >> $GITHUB_OUTPUT
          fi

      # Test with coverage のジョブが保存した npm のキャッシュ（@redocly/cli）を使う（読むだけ）
      - name: Restore npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('scripts/build-docs.sh') }}

      # Lambda の zip（src/nandemo_oshirase）には docs.html が含まれる。CD と同じく生成しないと
      # zip の内容が変わり、plan に Lambda の source_code_hash の差分が出てしまう。
      # ただし、docs.html にはコミットごとに変わるバージョンが入るので、
      # src に変更がなくても plan には Lambda の差分が出る
      - name: Build docs
        run: scripts/build-docs.sh "$(git describe --tags)"

      - name: Build the OTel instrumentations layer
        # tf/modules/otel_layers/main.tf の aws_lambda_layer_version.otel_instrumentations が使う zip（dist/otel-instrumentations-layer.zip）を作る
        run: python3 scripts/build-otel-instrumentations-layer.py

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          # terraform の出力の ARN に出るアカウント ID を、ログでマスクする
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17.0"
          # terraform output -raw の値をそのまま使うため、ラッパーを無効にする
          terraform_wrapper: false

      # Pre-commit checks のジョブが保存したプロバイダーのキャッシュを使う（読むだけ）
      - name: Prepare Terraform provider cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Restore Terraform provider cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('tf/envs/*/.terraform.lock.hcl') }}

      - name: Terraform Init
        run: |
          cd ${{ steps.config.outputs.tf_dir }}
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ steps.config.outputs.state_key }}" \
            -backend-config="region=ap-northeast-1"

      # API Gateway の ID（エンドポイントのホスト名）は、terraform の出力（Outputs など）に出るのでログでマスクする。
      # 既存の state の api_endpoint から取る（初めてのデプロイでは state が無いので、何もしない）
      - name: Mask the API Gateway ID
        id: mask
        run: |
          cd ${{ steps.config.outputs.tf_dir }}
          endpoint=$(terraform output -raw api_endpoint 2>/dev/null || true)
          api_id=${endpoint#https://}
          api_id=${api_id%%.*}
          if [[ -n "$endpoint" && "$api_id" != "$endpoint" ]]; then
            echo "::add-mask::$api_id"
            echo "api_id=$api_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Plan
        id: plan
        # tee でログにも出しつつファイルに保存する。
        # shell を明示すると pipefail が有効になり、plan の失敗を tee で握りつぶさない
        shell: bash
        run: |
          cd ${{ steps.config.outputs.tf_dir }}
          terraform plan -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Comment plan result
        # plan が失敗した場合も、エラーの内容を PR に残す
        if: always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          TF_ENV: ${{ steps.config.outputs.env }}
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
          API_ID: ${{ steps.mask.outputs.api_id }}
        with:
          script: |
            const fs = require('fs')
            let plan = fs.existsSync(process.env.PLAN_FILE)
              ? fs.readFileSync(process.env.PLAN_FILE, 'utf8')
              : '(plan の出力がありません)'

            // add-mask はコメントには効かないので、アカウント ID と API Gateway の ID を *** に置き換える
            for (const v of [process.env.AWS_ACCOUNT_ID, process.env.API_ID].filter((v) => v)) {
              plan = plan.split(v).join('***')
            }

            // 公開リポジトリのコメントにアカウントIDやリソースのIDが並ばないよう、
            // 既存リソースの読み込みの行（Refreshing state... [id=...] など）を除き、
            // 変更内容・エラー・警告だけを残す
            const noise = /^\S.*: (Refreshing state\.\.\.|Reading\.\.\.|Read complete after|Preparing import\.\.\.)/
            plan = plan.split('\n').filter((line) => !noise.test(line)).join('\n').trim()

            // PR のコメントは 65,536 文字までなので、長すぎる場合は末尾を残して切り詰める
            const limit = 60000
            if (plan.length > limit) {
              plan = '... (先頭を省略。全文は Actions のログを参照) ...\n' + plan.slice(-limit)
            }

            let body = `## Terraform Plan (${process.env.TF_ENV})\n\n`
            if (process.env.PLAN_OUTCOME !== 'success') {
              body += ':x: **plan に失敗しました。**\n\n'
            }
            if (process.env.PLAN_OUTCOME === 'success' && plan.includes('No changes.')) {
              body += 'No changes.'
            } else {
              body += [
                '<details>',
                '<summary>Show plan</summary>',
                '',
                '```',
                plan,
                '```',
                '',
                '</details>',
              ].join('\n')
            }

            // このワークフローのコメントだと分かる目印（画面には表示されない）。環境ごとに分ける
            const marker = `<!-- terraform-plan:${process.env.TF_ENV} -->`
            body = `${marker}\n${body}`

            // 新しくコメントし、最新の plan をいつも一番下に出す
            const { data: created } = await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            })

            // それより前の plan のコメントを Outdated として折りたたむ（人やほかのコメントには触らない）
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            for (const c of comments) {
              if (c.id === created.id) continue
              if (c.user?.login !== 'github-actions[bot]') continue
              if (!c.body?.startsWith(marker)) continue
              await github.graphql(
                `mutation($id: ID!) {
                  minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                    minimizedComment { isMinimized }
                  }
                }`,
                { id: c.node_id },
              )
            }
