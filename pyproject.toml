[project]
name = "nandemo-oshirase"
version = "0.1.0"
description = "A simple notification app that sends messages to LINE"
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-aws-lambda",
    "opentelemetry-instrumentation-urllib",
]

[project.scripts]
oshirase = "oshirase_cli.main:main"

[tool.uv]
default-groups = ["dev", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "--cov=nandemo_oshirase --cov=oshirase_cli --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src/nandemo_oshirase", "src/oshirase_cli"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
cli = [
    "boto3>=1.43.123",
]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]
