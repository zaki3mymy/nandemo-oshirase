openapi: "3.0.0"
info:
  title: なんでもお知らせくん API
  description: LINE通知を送信するAPI
  version: "0.0.0-dev"
paths:
  /notify:
    post:
      summary: Send notification
      description: LINEにメッセージを送信する
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                      description: 送信するメッセージ
                    dry_run:
                      $ref: "#/components/schemas/DryRun"
                  required:
                    - message
                - type: object
                  properties:
                    messages:
                      type: array
                      items:
                        type: string
                      description: 送信するメッセージのリスト
                    dry_run:
                      $ref: "#/components/schemas/DryRun"
                  required:
                    - messages
            examples:
              single:
                summary: Single message
                value:
                  message: Hello from なんでもお知らせくん!
              multiple:
                summary: Multiple messages
                value:
                  messages:
                    - Message 1
                    - Message 2
              dry_run:
                summary: Dry run (LINE には送信しない)
                value:
                  message: Hello from なんでもお知らせくん!
                  dry_run: true
      responses:
        "200":
          description: Successfully sent (dry run のときは送信せずに成功を返す)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                sent:
                  value:
                    message: Successfully sent 1 message(s)
                dry_run:
                  value:
                    message: "Dry run: would send 1 message(s) in 1 batch(es)"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                no_message:
                  value:
                    error: No message or messages key found
                empty:
                  value:
                    error: No valid messages to send
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
# /webhook はLINEプラットフォームが内部的に呼び出すエンドポイントであり、
# APIユーザー向けのドキュメントには記載しない。
components:
  schemas:
    DryRun:
      type: boolean
      default: false
      # 真偽値の true のときだけ有効で、文字列の "true" などは無視する
      description: true のときは LINE に送信せず、認証情報の読み込み・メッセージの検証・バッチへの分割と、LINE の validate API によるトークンとメッセージの形式の確認を行う（デプロイ後の動作確認用）
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
