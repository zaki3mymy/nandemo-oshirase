receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  awsxray:
    region: ap-northeast-1
  awsemf:
    region: ap-northeast-1
    namespace: NandemoOshirase

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      exporters: [awsemf]
